[project]
name = "retrycascade"
version = "0.2.0"
description = "RetryCascade experiment orchestration and analysis package"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25,<5",
  "PyYAML>=6.0,<7",
  "duckdb>=1.4,<2",
  "matplotlib>=3.9,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
  "pytest >=9.1,<10",
]
