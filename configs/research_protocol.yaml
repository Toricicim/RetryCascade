schema_version: "1.0.0"
protocol_version: "retrycascade-protocol-v1.1.0"
model_version: "retrycascade-des-v1.0.0"
rng_version: "keyed-chacha20-v1"
artifact_schema_version: "1.0.0"

claim_scope:
  model_type: exploratory_simulation
  empirical_calibration: false
  production_prediction: false

parameter_provenance:
  nominal_stage_rates: model_assumption
  queue_capacities: model_assumption
  service_demand_distribution: model_assumption
  timeout_and_deadline: model_assumption
  retry_policy_parameters: model_assumption
  recovery_thresholds: operational_definition
  rho_levels: experimental_factor
  trigger_durations: experimental_factor
  trigger_capacity_multiplier: experimental_factor
  main_seed_bank: preregistered_monte_carlo_design
  cache_300_90pct_3000_example: literature_motivation_only
  hotos_300_280_fixture: literature_mechanism_fixture_only

time:
  unit: microsecond
  ticks_per_second: 1000000
  overflow_behavior: simulator_error

scheduler:
  priorities:
    stage_completion: 1
    attempt_timeout: 2
    logical_deadline: 3
    trigger_boundary: 4
    retry_ready: 5
    logical_arrival: 6
    queue_sample: 7

topology:
  type: serial_pipeline
  queue_discipline: fifo
  downstream_queue_full: queue_rejected
  upstream_blocking: false
  stages:
    - name: source
      workers: 1
      queue_capacity_waiting: 100
      nominal_rate_work_units_per_second: 140
    - name: transform
      workers: 1
      queue_capacity_waiting: 100
      nominal_rate_work_units_per_second: 120
    - name: sink
      workers: 1
      queue_capacity_waiting: 100
      nominal_rate_work_units_per_second: 100

workload:
  arrival_process:
    distribution: poisson
    rate_definition: rho_times_nominal_sink_rate
    rho_basis_points: [5000, 6500, 8000, 9000, 9500]
  service_demand:
    distribution: lognormal
    parameterization: mean_and_coefficient_of_variation
    mean_work_units_milli: 1000
    coefficient_of_variation_milli: 500
  request_semantics:
    workload_kind: read_like_idempotent
    cancellation_after_timeout: false
    cancellation_after_other_attempt_success: false
    late_timed_out_completion_produces_goodput: false
    unique_goodput_per_logical_request: true

retry_contract:
  per_attempt_timeout_us: 500000
  timeout_origin: source_admission
  timeout_includes_all_queue_waiting: true
  overall_logical_deadline_us: 2000000
  max_attempts_including_initial: 3
  retryable_causes: [attempt_timeout, queue_rejected]
  maximum_one_retry_schedule_per_attempt_cause: true
  stop_creating_retries_after_logical_success: true
  stop_creating_retries_after_overall_deadline: true

policies:
  enabled: [immediate, exponential, full_jitter, retry_budget]
  common:
    exponential_base_us: 25000
    exponential_cap_us: 200000
  immediate:
    epsilon_us: 1
  exponential:
    delay_formula: capped_power_of_two
  full_jitter:
    delay_formula: uniform_inclusive_ticks
    jitter_rng_namespace: retry_jitter
  retry_budget:
    scheduling: full_jitter
    first_attempt_requires_token: false
    token_bucket_fixed_point:
      units_per_token: 10
      retry_cost_units: 10
      refill_units_per_unique_on_time_success: 1
      capacity_units: 100
      initial_units: 100
      token_denial_result: retry_denied
    source_load_shedding: false

trigger:
  target_stage: sink
  start_us: 300000000
  durations_us: [1000000, 3000000, 10000000, 30000000]
  capacity_multiplier_basis_points: 5000
  interval_semantics: half_open
  active_service_demand_resampled: false
  remaining_work_processed_at_new_rate: true
  clear_queue_at_end: false
  clear_inflight_at_end: false

observation:
  arrivals_begin_us: 0
  warmup_end_us: 180000000
  baseline_start_us: 180000000
  baseline_end_us: 300000000
  queue_sample_interval_us: 100000
  post_trigger_artifact_horizon_us: 900000000
  primary_recovery_horizon_us: 600000000
  sensitivity_horizons_us: [300000000, 600000000, 900000000]

baseline:
  source: trigger_run_pretrigger
  assert_equal_to_matched_no_trigger_pretrigger: true
  matching_keys: [rho_basis_points, policy, main_seed]
  window_us: 30000000
  non_overlapping_windows: true
  g0_statistic: median_window_logical_goodput
  q0_statistic: p95_of_window_mean_total_queue_occupancy
  stability_check:
    minimum_success_ratio_basis_points: 9500
    maximum_goodput_cv_basis_points: 1000
    maximum_absolute_queue_slope_milli_slots_per_second: 50
    failure_label: baseline_unstable

recovery:
  window_us: 30000000
  consecutive_non_overlapping_windows: 3
  goodput_fraction_of_g0_basis_points: 9500
  queue_margin_fraction_of_total_waiting_capacity_basis_points: 500
  sensitivity:
    goodput_fractions_basis_points: [9000, 9500, 9900]
    queue_margin_fractions_basis_points: [200, 500, 1000]
  non_recovery_label: operational_non_recovery_within_horizon

experiment:
  main_seeds:
    [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010,
     1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020,
     1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030]
  pilot_seeds: [900001, 900002, 900003]
  pilot_in_primary_analysis: false
  common_random_numbers: true
  expected_trigger_runs: 2400
  expected_no_trigger_runs: 600
  expected_total_primary_runs: 3000

rng:
  namespaces:
    arrival: external_arrival
    service: service_demand
    jitter: retry_jitter
  arrival_key: [main_seed, logical_arrival_index]
  service_key: [main_seed, logical_request_id, attempt_no, stage]
  jitter_key: [main_seed, logical_request_id, attempt_no, policy]
  policy_must_not_change_arrival_trace: true
  policy_must_not_change_shared_service_samples: true

source_load_shedding_experiment:
  included_in_primary_3000_runs: false
  analysis_status: secondary_preregistered
  base_retry_policy: full_jitter
  rho_basis_points: [8000, 9000, 9500]
  trigger_durations_us: [10000000, 30000000]
  use_main_seeds: true
  expected_additional_runs: 180
  controller:
    metric: source_queue_occupancy_fraction
    activate_at_or_above_basis_points: 8000
    deactivate_at_or_below_basis_points: 5000
    action: reject_new_logical_arrival
  required_cost_metrics:
    [source_shed_rate, success_ratio, attempts_exhausted_rate,
     deadline_abandonment_rate, recovered_by_horizon]

safety:
  maximum_events_per_run: 20000000
  event_cap_result: simulator_error
  unfinished_at_artifact_horizon: inflight_at_horizon

exclusions:
  technical_exclusion_reasons:
    [schema_validation_failure, simulator_invariant_failure, event_cap_reached,
     arithmetic_overflow, artifact_checksum_failure, infrastructure_interruption,
     common_random_number_mismatch]
  forbidden_result_exclusions:
    [operational_non_recovery, high_latency, high_amplification,
     unexpected_policy_ordering, null_hypothesis_result, baseline_unstable]
  baseline_unstable_handling:
    exclude_from_trigger_induced_metastability_claim: true
    retain_and_report_run: true
  rerun_same_config_same_seed_only: true
  replacement_seed_forbidden: true

analysis:
  alpha_familywise_basis_points: 500
  primary_hypotheses: [H1]
  multiplicity_adjustment: not_required_for_single_primary_hypothesis
  cell_recovery_interval: wilson_95
  rho50_method: monotone_isotonic_interpolation
  extrapolate_rho50_outside_observed_range: false
  bootstrap:
    type: paired_seed_block
    replicates: 10000
    confidence_level_basis_points: 9500
    rng_seed: 424242
  h1:
    comparison: retry_budget_minus_full_jitter
    mechanism_held_constant: full_jitter_schedule_and_backoff_parameters
    high_stress_rho_basis_points: [8000, 9000, 9500]
    high_stress_trigger_durations_us: [10000000, 30000000]
    effectiveness_estimand: paired_difference_in_recovered_by_primary_horizon
    confirmatory_summary: equal_weight_mean_over_preregistered_high_stress_cells
    alternative: greater_than_zero
    primary_user_cost_estimand: paired_difference_in_unique_on_time_success_ratio
    additional_cost_metrics:
      [deadline_abandonment_rate, attempts_per_logical_request, retry_denied_rate]
    always_report_cell_specific_effects: true
    recovery_gain_alone_does_not_imply_policy_dominance: true
  secondary_questions:
    policy_condition_interaction:
      status: descriptive_with_uncertainty
      factors: [rho_basis_points, trigger_duration_us]
      crossover_not_assumed: true
    recovery_definition_sensitivity:
      status: exploratory
      comparison: queue_only_vs_joint_goodput_and_queue
      no_real_world_ground_truth_claim: true
    rho50:
      status: duration_specific_secondary_boundary_summary
      extrapolation_forbidden: true
      report_censored_when_crossing_absent: true
    standard_policy_package_comparison:
      status: descriptive
      policies: [immediate, exponential, full_jitter, retry_budget]
    pure_jitter_causal_claim:
      status: dropped_until_mean_matched_control_exists

provenance:
  require_protocol_sha256: true
  require_run_config_sha256: true
  require_git_commit: true
  require_binary_sha256: true
  require_dependency_lock_sha256: true
  require_artifact_sha256: true
  require_semantic_checksum: true
  canonicalization:
    format: canonical_json_integer_domain
    utf8: true
    sorted_object_keys: true
    reject_duplicate_yaml_keys: true
    reject_nonfinite_numbers: true
    exclude_fields_from_hash: [protocol_sha256, run_config_sha256]
